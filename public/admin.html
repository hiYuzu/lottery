<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>管理</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="admin-page">
    <header class="toolbar">
      <div class="brand">
        <a class="brand-mark" href="/" aria-label="抽奖首页">抽</a>
        <h1>管理</h1>
        <span class="event-year">2027</span>
      </div>
      <div class="actions">
        <span id="connection" role="status">连接中</span><a href="/">主持台</a
        ><a href="/?display=1" target="_blank" rel="noopener">投屏</a
        ><button id="logout">退出</button>
      </div>
    </header>
    <main class="admin-container">
      <section class="panel activity-panel">
        <h2>活动</h2>
        <div class="actions">
          <label>活动<select id="sessions"></select></label
          ><button id="switch-session">切换</button
          ><button id="archive-session">归档</button>
        </div>
        <div class="actions">
          <label>名称<input id="session-name" maxlength="80" /></label
          ><label
            >模式<select id="session-mode">
              <option value="formal">正式</option>
              <option value="rehearsal">彩排</option>
            </select></label
          ><button id="create-session">新建</button>
        </div>
      </section>
      <section class="panel prizes-panel">
        <div class="section-heading">
          <h2>奖项</h2>
          <span id="draft-status"></span>
        </div>
        <form id="prize-form">
          <div id="prize-editor"></div>
          <div class="actions">
            <button type="button" id="add-prize">添加</button
            ><button class="primary" id="save-prizes">保存</button
            ><button type="button" id="discard">还原</button>
          </div>
        </form>
      </section>
      <section class="panel people-panel">
        <h2>人员</h2>
        <div class="actions">
          <label>搜索<input id="search" /></label
          ><label
            >地区<select id="dept-filter">
              <option value="">全部</option>
            </select></label
          ><label
            >状态<select id="status-filter">
              <option value="">全部</option>
              <option value="drawn">已中奖</option>
              <option value="available">未中奖</option>
            </select></label
          >
        </div>
        <div class="people-heading">
          <span>姓名</span><span>编号</span><span>地区</span><span>状态</span
          ><span>操作</span>
        </div>
        <div id="people"></div>
        <label>名单<textarea id="batch-input" rows="5"></textarea></label>
        <div class="actions">
          <button id="preview">预览</button
          ><button id="import" disabled>导入</button>
        </div>
        <div id="import-preview"></div>
      </section>
      <section class="panel control-panel">
        <h2>抽奖控制</h2>
        <div class="actions">
          <button id="undo">撤销</button
          ><button id="reset" class="danger">重置</button
          ><button data-export="xlsx">导出表格</button
          ><button data-export="txt">导出文本</button>
        </div>
      </section>
    </main>
    <div id="toast" role="status"></div>
    <script type="module" src="admin.js"></script>
  </body>
</html>
