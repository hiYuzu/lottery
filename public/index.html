<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>抽奖</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="draw-page">
    <header class="toolbar">
      <div class="brand">
        <a class="brand-mark" href="/" aria-label="抽奖首页">抽</a>
        <h1 id="activity-name">年度抽奖</h1>
        <span class="event-year">2027</span>
      </div>
      <div class="actions">
        <span id="connection" role="status">连接中</span
        ><button id="fullscreen">全屏</button><button id="qr">二维码</button
        ><button id="music">音乐</button><a href="/?display=1">投屏</a
        ><a href="/admin.html">管理</a>
      </div>
    </header>
    <main class="container">
      <section class="stage-panel">
        <div class="stage-toolbar">
          <nav id="prize-tabs" aria-label="奖项"></nav>
          <span id="mode" class="mode-badge"></span>
        </div>
        <div class="draw-ticket">
          <div class="ticket-main">
            <h2 id="prize-name">奖项</h2>
            <div id="stage" class="draw-stage" aria-live="polite">准备</div>
            <div id="progress" class="metrics"></div>
          </div>
          <aside class="ticket-stub" aria-label="当前轮次">
            <span>轮次</span>
            <strong id="round-number">01</strong>
            <div class="ticket-barcode" aria-hidden="true"></div>
          </aside>
        </div>
        <div class="actions stage-actions">
          <button id="draw" class="primary draw-button" hidden>开始抽奖</button
          ><button id="cancel-round" hidden>取消本轮</button
          ><button id="poster" hidden>海报</button>
        </div>
      </section>
      <aside class="results-panel">
        <h2>中奖名单</h2>
        <div id="results"></div>
        <details>
          <summary>抽奖记录</summary>
          <div id="history"></div>
        </details>
        <div class="actions">
          <button data-export="xlsx">导出表格</button
          ><button data-export="txt">导出文本</button>
        </div>
      </aside>
    </main>
    <div id="toast" role="status"></div>
    <audio id="bg-music" loop preload="none" src="music/bg.mp3"></audio
    ><audio id="win-music" preload="none" src="music/win.mp3"></audio>
    <script type="module" src="script.js"></script>
  </body>
</html>
