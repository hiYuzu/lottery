<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理员登录</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <main class="login-container">
      <div class="login-card">
        <div class="login-main">
          <h1>管理员登录</h1>
          <form id="login-form">
            <label
              >密码
              <input
                type="password"
                id="input-password"
                autocomplete="current-password"
                autofocus
                required
              />
            </label>
            <button type="submit" class="primary">登录</button>
          </form>
          <div id="login-error" class="login-error hidden" role="alert"></div>
          <a href="/" class="login-back">返回抽奖</a>
        </div>
        <aside class="login-stub" aria-label="年度抽奖">
          <span>年度抽奖</span>
          <strong class="event-year">2027</strong>
          <div class="ticket-barcode" aria-hidden="true"></div>
        </aside>
      </div>
    </main>
    <script type="module">
      import { EVENT_YEAR } from "./common.js";
      document.querySelector(".event-year").textContent = EVENT_YEAR;
      (function () {
        "use strict";
        const form = document.getElementById("login-form");
        const input = document.getElementById("input-password");
        const errorEl = document.getElementById("login-error");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          errorEl.classList.add("hidden");
          const password = input.value;
          if (!password) return;
          try {
            const res = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password }),
            });
            const data = await res.json();
            if (data.success) {
              sessionStorage.setItem("adminToken", data.token);
              location.href = "/admin.html";
            } else {
              errorEl.textContent = "密码错误";
              errorEl.classList.remove("hidden");
            }
          } catch {
            errorEl.textContent = "网络错误";
            errorEl.classList.remove("hidden");
          }
        });
      })();
    </script>
  </body>
</html>
